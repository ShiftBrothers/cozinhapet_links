<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozinha Pet | Links</title>
  <meta name="description" content="Alimentação natural, receitas balanceadas e cálculo exato de porções para o bem-estar do seu pet." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:          #0C1F14;
      --surface:     rgba(27, 53, 39, 0.55);
      --border:      rgba(255, 255, 255, 0.07);
      --accent-gold: #E5A93C;
      --accent-lime: #6FCF7A;
      --text:        #EFF5EF;
      --muted:       #7FA886;
      --glow-green:  rgba(111, 207, 122, 0.25);
      --grad: linear-gradient(135deg, #E5A93C, #6FCF7A, #4E8752, #E5A93C);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 56px 20px 48px;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      top: -180px; left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(78,135,82,0.22) 0%, transparent 70%);
      filter: blur(30px);
    }
    body::after {
      width: 400px; height: 400px;
      bottom: -100px; right: -80px;
      background: radial-gradient(circle, rgba(229,169,60,0.12) 0%, transparent 70%);
      filter: blur(40px);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-ring {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }
    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--grad);
      background-size: 300% 300%;
      animation: spin-grad 4s linear infinite;
      z-index: 0;
    }
    .avatar-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #172c1f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      border: 3px solid var(--bg);
    }

    .profile-name {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(120deg, var(--text) 40%, var(--accent-lime));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-bio {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.55;
      max-width: 380px;
      margin-bottom: 36px;
      font-weight: 400;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-wrap {
      position: relative;
      border-radius: 14px;
      padding: 2px;
      background: transparent;
    }

    .link-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--grad);
      background-size: 300% 300%;
      opacity: 0;
      transition: opacity 0.35s ease;
      animation: spin-grad 3s linear infinite;
      z-index: 0;
    }

    .link-wrap:hover::before {
      opacity: 1;
    }

    .link-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 17px 22px;
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 600;
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .link-wrap:hover .link-card {
      background: rgba(36, 68, 49, 0.75);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 0 18px var(--glow-green);
      border-color: transparent;
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .link-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .link-wrap:hover .link-icon {
      background: rgba(229,169,60,0.12);
      border-color: rgba(229,169,60,0.3);
    }

    .link-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .link-label span {
      line-height: 1.3;
    }

    .link-label small {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .link-arrow {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }

    .link-wrap:hover .link-arrow {
      background: rgba(229,169,60,0.15);
      color: var(--accent-gold);
      transform: translateX(3px);
    }

    footer {
      margin-top: 44px;
      font-size: 0.78rem;
      color: var(--muted);
      opacity: 0.65;
    }

    .container > * {
      animation: fade-up 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .avatar-ring  { animation-delay: 0.05s; }
    .profile-name { animation-delay: 0.12s; }
    .profile-bio  { animation-delay: 0.18s; }
    .links-list   { animation-delay: 0.26s; }
    footer        { animation-delay: 0.34s; }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin-grad {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }
  </style>
</head>
<body>
  <main class="container">

    <div class="avatar-ring">
      <div class="avatar-inner">🥗</div>
    </div>

    <h1 class="profile-name">Cozinha Pet</h1>
    <p class="profile-bio">Alimentação natural, receitas balanceadas e cálculo exato de porções para o bem‑estar do seu pet.</p>

    <nav class="links-list" aria-label="Links principais">

      <div class="link-wrap">
        <a
          id="link-site"
          href="https://www.cozinhapets.com.br"
          target="_blank"
          rel="noopener noreferrer"
          class="link-card"
          aria-label="Acesse o site da Cozinha Pet"
        >
          <div class="link-content">
            <span class="link-icon">🌐</span>
            <div class="link-label">
              <span>Site Cozinha Pet</span>
              <small>cozinhapets.com.br</small>
            </div>
          </div>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <div class="link-wrap">
        <a
          id="link-whatsapp"
          href="https://api.whatsapp.com/send/?phone=5541988752887&text=Ol%C3%A1%21+Vim+pelo+site+da+Cozinha+Pet+e+gostaria+de+saber+mais+sobre+as+op%C3%A7%C3%B5es+de+alimenta%C3%A7%C3%A3o+natural+para+o+meu+pet.+Pode+me+ajudar%3F&type=phone_number&app_absent=0"
          target="_blank"
          rel="noopener noreferrer"
          class="link-card"
          aria-label="Fale com a Cozinha Pet pelo WhatsApp"
        >
          <div class="link-content">
            <span class="link-icon">💬</span>
            <div class="link-label">
              <span>Fale no WhatsApp</span>
              <small>Atendimento personalizado</small>
            </div>
          </div>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>

    </nav>

    <footer>© Cozinha Pet · Alimentação Natural</footer>

  </main>
</body>
</html>
