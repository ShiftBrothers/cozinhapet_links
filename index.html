<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozinha Pet | Links</title>
  <meta name="description"
    content="Alimentacao natural, receitas balanceadas e calculo exato de porcoes para o bem-estar do seu pet." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #1B4BAE;
      /* azul da logo */
      --surface: #CC2229;
      /* vermelho da logo */
      --surface-hover: #B51E24;
      /* vermelho mais escuro no hover */
      --border: rgba(255, 255, 255, 0.18);
      --red: #CC2229;
      --blue: #1B4BAE;
      --text: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.70);
      /* Gradiente de borda hover: branco → azul claro → branco */
      --grad: linear-gradient(135deg, #FFFFFF, #7BAAFF, #FFFFFF);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.20);
      --shadow-hover: 0 10px 32px rgba(0, 0, 0, 0.35);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      /* Gradiente sutil de profundidade no azul */
      background-image: radial-gradient(ellipse at top, #2460D8 0%, #1B4BAE 55%, #142F7A 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 56px 20px 48px;
      overflow-x: hidden;
    }

    /* Brilho suave vermelho no centro-topo (reflexo da logo) */
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 340px;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(204, 34, 41, 0.20) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Container ─────────────────────────────── */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ── Logo ──────────────────────────────────── */
    .logo-wrap {
      width: 100%;
      max-width: 320px;
      margin-bottom: 10px;
      animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.05s;
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Bio ───────────────────────────────────── */
    .profile-bio {
      font-size: 0.93rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 38px;
      font-weight: 400;
      animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.14s;
    }

    /* ── Links ─────────────────────────────────── */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
      animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.22s;
    }

    /* Animated-gradient-border wrapper */
    .link-wrap {
      position: relative;
      border-radius: 14px;
      padding: 2px;
    }

    /* Hidden gradient ring — revealed on hover */
    .link-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--grad);
      background-size: 300% 300%;
      opacity: 0;
      transition: opacity 0.32s ease;
      animation: spin-grad 3s linear infinite;
      z-index: 0;
    }

    .link-wrap:hover::before {
      opacity: 1;
    }

    /* Card itself */
    .link-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 22px;
      background: var(--surface);
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      border-radius: 12px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.97rem;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .link-wrap:hover .link-card {
      background: var(--surface-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: transparent;
    }

    /* Icon box */
    .link-content {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .link-icon {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: background 0.25s, border-color 0.25s;
    }

    .link-wrap:hover .link-icon {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.45);
    }

    /* Labels */
    .link-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .link-label span {
      line-height: 1.25;
    }

    .link-label small {
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.68);
      font-weight: 400;
    }

    /* Arrow */
    .link-arrow {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.80);
      font-size: 0.85rem;
      transition: background 0.25s, color 0.25s, transform 0.25s;
    }

    .link-wrap:hover .link-arrow {
      background: rgba(255, 255, 255, 0.30);
      color: #FFFFFF;
      transform: translateX(3px);
    }

    /* ── Footer ────────────────────────────────── */
    footer {
      margin-top: 44px;
      font-size: 0.77rem;
      color: var(--muted);
      opacity: 0.7;
      animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.30s;
    }

    /* ── Animations ────────────────────────────── */
    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin-grad {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- Logo substitui avatar + titulo -->
    <div class="logo-wrap">
      <img src="logo.png" alt="Cozinha Pet" width="320" height="auto" />
    </div>

    <p class="profile-bio">
      Alimentação natural, receitas balanceadas e cálculo exato de porções<br>para o bem‑estar do seu pet.
    </p>

    <nav class="links-list" aria-label="Links principais">

      <!-- Site -->
      <div class="link-wrap">
        <a id="link-site" href="https://www.cozinhapets.com.br" target="_blank" rel="noopener noreferrer"
          class="link-card" aria-label="Acesse o site da Cozinha Pet">
          <div class="link-content">
            <img src="icon-site.png" alt="Cozinha Pet" class="link-icon" style="width:36px;height:36px;object-fit:contain;border-radius:50%;" />
            <div class="link-label">
              <span>Site Cozinha Pet</span>
              <small>cozinhapets.com.br</small>
            </div>
          </div>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <!-- WhatsApp -->
      <div class="link-wrap">
        <a id="link-whatsapp"
          href="https://api.whatsapp.com/send/?phone=5541988752887&text=Ol%C3%A1%21+Vim+pelo+site+da+Cozinha+Pet+e+gostaria+de+saber+mais+sobre+as+op%C3%A7%C3%B5es+de+alimenta%C3%A7%C3%A3o+natural+para+o+meu+pet.+Pode+me+ajudar%3F&type=phone_number&app_absent=0"
          target="_blank" rel="noopener noreferrer" class="link-card" aria-label="Fale com a Cozinha Pet pelo WhatsApp">
          <div class="link-content">
            <span class="link-icon">💬</span>
            <div class="link-label">
              <span>Fale no WhatsApp</span>
              <small>Atendimento personalizado</small>
            </div>
          </div>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>

    </nav>

    <footer>© Cozinha Pet · Alimentação Natural</footer>

  </main>
</body>

</html>
